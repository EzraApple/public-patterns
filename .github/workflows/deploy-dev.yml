name: Deploy dev

on:
  workflow_dispatch:

concurrency:
  group: public-patterns-web-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy-web-dev:
    name: Deploy web dev
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Run local smoke test
        run: pnpm dev:smoke

      - name: Install Doppler CLI
        uses: dopplerhq/cli-action@v4

      - name: Deploy dev Worker
        run: doppler run -- pnpm deploy:web:dev:ci
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_DEV_TOKEN }}
